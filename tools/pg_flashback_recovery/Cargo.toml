[package]
name = "pg-flashback-recovery"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/CaghanTU/pg_flashback"
description = "Backup-backed recovery executor for pg_flashback"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
nix = { version = "0.29", features = ["fs", "process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
