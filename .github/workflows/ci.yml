name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PGRX_VERSION: "0.16.1"

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-lint-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libclang-dev clang shellcheck

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version "=${{ env.PGRX_VERSION }}" --locked

      - name: Initialize pgrx (needed for proc-macro compilation)
        run: cargo pgrx init --pg17 download

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --no-default-features --features pg17 -- -D warnings

      - name: Shell syntax and ShellCheck
        run: |
          bash -n scripts/*.sh
          shellcheck -S warning scripts/*.sh

      - name: Whitespace check
        run: git diff --check

  test:
    name: Test (PG ${{ matrix.pg }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17", "18"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libclang-dev clang

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-pg${{ matrix.pg }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-pg${{ matrix.pg }}-

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version "=${{ env.PGRX_VERSION }}" --locked

      - name: Initialize pgrx for PG ${{ matrix.pg }}
        run: cargo pgrx init --pg${{ matrix.pg }} download

      - name: Remove stale test-pgdata (prevents mutex lock errors)
        run: rm -rf target/test-pgdata

      - name: cargo pgrx test
        run: cargo pgrx test pg${{ matrix.pg }}

      - name: Generated SQL duplicate-definition check
        run: |
          cargo pgrx schema pg${{ matrix.pg }} \
            --no-default-features --features pg${{ matrix.pg }} \
            -o target/generated-pg${{ matrix.pg }}.sql
          scripts/check_generated_sql_duplicates.sh \
            target/generated-pg${{ matrix.pg }}.sql

      - name: Production generated SQL has no flashback_test_* surface
        run: |
          PG_MAJOR=${{ matrix.pg }} \
            OUT_DIR=target/generated-sql-no-test-surface \
            scripts/check_generated_sql_no_test_surface.sh

      - name: Core tree has no deferred backup surface
        run: |
          PG_MAJOR=${{ matrix.pg }} \
            OUT_DIR=target/generated-sql-no-backup-surface \
            scripts/check_core_no_backup_surface.sh

      - name: Core tree is WAL-only (no trigger-capture surface)
        run: |
          PG_MAJOR=${{ matrix.pg }} \
            OUT_DIR=target/generated-sql-wal-only-surface \
            scripts/check_core_wal_only_surface.sh

      - name: Runtime state mutations are centralized
        run: scripts/check_centralized_state_surface.sh

      - name: Integration SQL inventory classification
        run: python3 scripts/check_integration_inventory.py

  audit:
    name: Security audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-audit-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: |
          cargo audit --file Cargo.lock

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check dependency licenses and sources
        run: |
          cargo deny check licenses sources
