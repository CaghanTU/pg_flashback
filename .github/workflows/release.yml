name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PGRX_VERSION: "0.16.1"

jobs:
  verify-version:
    name: Verify tag and changelog
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Match tag to package version
        run: |
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          # Version comes from Cargo.toml.
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            test "${GITHUB_REF_NAME%-rc.*}" = "v${package_version}"
          else
            test "${GITHUB_REF_NAME}" = "v${package_version}"
            grep -Fq "## [${package_version}]" CHANGELOG.md
          fi

  extension-package:
    name: Extension package (PG${{ matrix.pg }})
    needs: verify-version
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17", "18"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libclang-dev clang

      - name: Install cargo-pgrx and PostgreSQL ${{ matrix.pg }}
        run: |
          cargo install cargo-pgrx --version "=${{ env.PGRX_VERSION }}" --locked
          cargo pgrx init --pg${{ matrix.pg }} download

      - name: Build install tree
        run: |
          cargo pgrx package \
            --pg-config "$(cargo pgrx info pg-config ${{ matrix.pg }})" \
            --no-default-features --features pg${{ matrix.pg }} \
            --out-dir dist/package

      - name: Create extension archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive_root="pg_flashback-${version}-pg${{ matrix.pg }}-x86_64-linux"
          package_so="$(find dist/package -type f -name pg_flashback.so -print -quit)"
          package_control="$(find dist/package -type f -name pg_flashback.control -print -quit)"
          mapfile -t package_sql < <(find dist/package -type f -name 'pg_flashback--*.sql' | sort)
          test -n "$package_so" && test -n "$package_control" && test "${#package_sql[@]}" -gt 0
          mkdir -p "dist/${archive_root}/lib" "dist/${archive_root}/bin" \
            "dist/${archive_root}/share/extension" "dist/${archive_root}/docs/samples" \
            "dist/${archive_root}/scripts"
          install -m 0755 "$package_so" "dist/${archive_root}/lib/pg_flashback.so"
          install -m 0755 scripts/pg_flashback \
            "dist/${archive_root}/bin/pg_flashback"
          install -m 0644 "$package_control" "${package_sql[@]}" \
            "dist/${archive_root}/share/extension/"
          printf '%s\n' "${{ matrix.pg }}" > "dist/${archive_root}/PG_MAJOR"
          printf '%s\n' "fresh-install-only" > "dist/${archive_root}/INSTALL_CONTRACT"
          cp README.md LICENSE CHANGELOG.md SECURITY.md THIRD_PARTY_NOTICES.md \
            "dist/${archive_root}/"
          cp docs/QUICKSTART.md docs/SUPPORT.md docs/ARCHITECTURE.md \
            docs/DEVELOPMENT.md \
            "dist/${archive_root}/docs/"
          cp docs/samples/postgresql.pg_flashback.conf \
            "dist/${archive_root}/docs/samples/"
          install -m 0755 scripts/run_local_package_smoke.sh \
            "dist/${archive_root}/scripts/"
          (
            cd "dist/${archive_root}"
            sha256sum lib/pg_flashback.so bin/pg_flashback share/extension/* > SHA256SUMS
          )
          jq -n \
            --arg version "$version" \
            --arg pg "${{ matrix.pg }}" \
            --arg so "$(sha256sum dist/${archive_root}/lib/pg_flashback.so | awk '{print $1}')" \
            --arg cli "$(sha256sum dist/${archive_root}/bin/pg_flashback | awk '{print $1}')" \
            '{schema_version:1,product:"pg_flashback",profile:"local_delta",version:$version,postgresql_major:$pg,install_contract:"fresh-install-only",artifacts:{shared_object_sha256:$so,cli_binary_sha256:$cli}}' \
            > "dist/${archive_root}/MANIFEST.json"
          printf '%s\n' '{"spdxVersion":"SPDX-2.3","name":"pg_flashback","packages":[{"name":"pg_flashback"}]}' \
            > "dist/${archive_root}/SBOM.spdx.json"
          tar -C dist -czf "dist/${archive_root}.tar.gz" "$archive_root"

      - name: Smoke-install the portable archive layout
        run: |
          pg_config="$(cargo pgrx info pg-config ${{ matrix.pg }})"
          archive="$(find dist -maxdepth 1 -type f -name 'pg_flashback-*-pg${{ matrix.pg }}-x86_64-linux.tar.gz' -print -quit)"
          test -n "$archive"
          ARCHIVE="$archive" PG_CONFIG="$pg_config" ./scripts/run_local_package_smoke.sh

      - name: Upload extension archive
        uses: actions/upload-artifact@v4
        with:
          name: pg-flashback-pg${{ matrix.pg }}
          path: dist/*.tar.gz
          if-no-files-found: error
  draft-release:
    name: Assemble draft release
    needs: [extension-package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify archive set and generate checksums
        run: |
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 4
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" =~ -rc\.[0-9]+$ ]]; then
            awk '
              /^## \[/ && $0 != "## [Unreleased]" {exit}
              /^## \[Unreleased\]/ {found=1; next}
              found {print}
            ' CHANGELOG.md > dist/RELEASE_NOTES.md
          else
            awk -v heading="## [${version}]" '
              $0 == heading {found=1; next}
              found && /^## \[/ {exit}
              found {print}
            ' CHANGELOG.md > dist/RELEASE_NOTES.md
          fi
          test -s dist/RELEASE_NOTES.md

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
