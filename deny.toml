[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is an unmaintained transitive build/test dependency of pgrx; upstream offers no safe compatible upgrade" },
    { id = "RUSTSEC-2021-0127", reason = "serde_cbor is an unmaintained transitive dependency of pgrx; it is not selected by pg_flashback application code and upstream offers no safe compatible upgrade" },
]

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
