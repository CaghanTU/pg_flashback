# Sample postgresql.conf fragment for the local_delta product profile.
# Copy lines you need. pg_flashback never edits this file automatically.
#
# Restart required after changing shared_preload_libraries, wal_level,
# max_worker_processes, max_replication_slots, or max_wal_senders.

shared_preload_libraries = 'pg_flashback'
wal_level = logical

# Leave headroom for one capture + one maintenance worker per target database,
# plus other cluster workers.
max_worker_processes = 16
max_replication_slots = 8
max_wal_senders = 8

# Prefer a finite cap so slot loss + an open coverage gap fails closed before
# the filesystem fills. Tune to available WAL disk.
max_slot_wal_keep_size = '4GB'

pg_flashback.enabled = on
pg_flashback.capture_mode = wal
pg_flashback.target_databases = 'appdb'
pg_flashback.max_workers = 4

# Mandatory capacity budgets. Protect/restore fail closed when unset.
# Size them from: SELECT flashback_config_recommend('schema.table');
# or: pg_flashback config recommend schema.table
pg_flashback.local_max_snapshot_bytes = '2GB'
pg_flashback.local_max_restore_peak_bytes = '4GB'
pg_flashback.local_min_filesystem_bytes = '5GB'
pg_flashback.local_safety_reserve_bytes = '64MB'
