# Sample postgresql.conf fragment for the local_delta product profile.
# Copy lines you need. pg_flashback never edits this file automatically.
#
# Restart required after changing shared_preload_libraries, wal_level,
# max_worker_processes, max_replication_slots, or max_wal_senders.

shared_preload_libraries = 'pg_flashback'
wal_level = logical

# Current security-patched PostgreSQL minors (15.19/16.15/17.11/18.6 and
# later) added an output_plugin_libraries allowlist GUC. Without this line,
# real logical slot creation for the pg_flashback output plugin fails:
#   library "pg_flashback" may not be used as an output plugin
# Older minors do not have this GUC at all -- leave the line out on those
# (do not set it to '*'). `SHOW output_plugin_libraries;` errors with
# "unrecognized configuration parameter" if your minor does not have it.
# `pg_flashback config recommend` prints this line automatically when it
# applies to the connected server.
output_plugin_libraries = 'pg_flashback'

# Leave headroom for one capture + one maintenance worker per target database,
# plus other cluster workers.
max_worker_processes = 16
max_replication_slots = 8
max_wal_senders = 8

# Prefer a finite cap so slot loss + an open coverage gap fails closed before
# the filesystem fills. Tune to available WAL disk.
max_slot_wal_keep_size = '4GB'

pg_flashback.enabled = on
# Deprecated compatibility GUC — only wal is valid (trigger/auto fail closed).
pg_flashback.capture_mode = wal
pg_flashback.target_databases = 'appdb'
pg_flashback.max_workers = 4

# Mandatory capacity budgets. Protect/restore fail closed when unset.
# Size them from: SELECT flashback_config_recommend('schema.table');
# or: pg_flashback config recommend schema.table
# track_commit_timestamp is not required for WAL-only capture.
pg_flashback.local_max_snapshot_bytes = '2GB'
pg_flashback.local_max_restore_peak_bytes = '4GB'
pg_flashback.local_min_filesystem_bytes = '5GB'
pg_flashback.local_safety_reserve_bytes = '64MB'

# Optional: external_zstd SnapshotStore (supported opt-in production
# backend; heap_v1 -- no extra GUCs above -- remains the default). Uncomment
# to stream the base image as a compressed artifact to an external
# filesystem root instead of storing it inside PostgreSQL. Activate per
# table with: pg_flashback maintain schema.table --yes
#
# pg_flashback.snapshot_storage_backend = 'external_zstd'
# # Must exist, be owned by the PostgreSQL server user, mode 0700, and be
# # outside PGDATA and outside every tablespace directory.
# pg_flashback.external_snapshot_root = '/var/lib/pg_flashback/snapshots'
# # Explicit, positive min-free and reserve budgets -- no implicit
# # "use whatever is left" behavior.
# pg_flashback.external_snapshot_min_free_bytes = '5GB'
# pg_flashback.external_snapshot_safety_reserve_bytes = '256MB'
# # Optional tuning; sensible defaults apply if unset.
# pg_flashback.external_snapshot_batch_rows = '2000'
# pg_flashback.external_snapshot_zstd_level = '3'
# pg_flashback.external_snapshot_max_row_bytes = '1MB'
